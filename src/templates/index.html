<html lang="ja">

<head>
    <meta http-equiv="Content-Language" content="ja">
    <meta charset="utf-8">
    <!-- interactive-widget=resizes-content: ソフトキーボード表示時にレイアウトビューポートを縮める
         （Chrome 108+ の既定 resizes-visual だと画面がパンされてアバターが画面外に押し出される。
           縮めればアバター領域が flex で縮小し、Live2D が ResizeObserver で全身を再フィットする） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">

    <!-- タブのアイコン。Live2D モデルから生成したものを Gateway が返す（未生成時は簡易マーク） -->
    <link rel="icon" href="/favicon.ico">
    <title>ワタシノセカイト初音ミク</title>

    <!-- 外部スタイルシート -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="container">
        <!-- アバター表示コンポーネント（Live2D版） -->
        <miku-avatar-live2d></miku-avatar-live2d>

        <!-- 返答テキスト字幕（サイズゼロのアンカー要素。アバター領域下部にオーバーレイ表示） -->
        <miku-caption></miku-caption>

        <!-- チャット入力コンポーネント -->
        <miku-chat></miku-chat>

        <!-- ヘルプボタン（右上固定。長押し中だけ隠れた操作のヒント一覧を表示） -->
        <miku-help></miku-help>

        <!-- 画面ロックモード（表示メニューから起動する全画面オーバーレイ） -->
        <miku-lock></miku-lock>
    </div>

    <!-- Socket.IO（CDN） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <!-- メインスクリプト（ESモジュール） -->
    <script type="module" src="/js/main.js"></script>
</body>

</html>
