<html lang="ja">

<head>
    <meta http-equiv="Content-Language" content="ja">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico">
    <title>ワタシノセカイト初音ミク</title>
    <style>
        :root {
            --main-color: #39c5bb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4fbfa;
            font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            color: #333;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 360px;
            background: #fff;
            border-radius: 14px;
            padding: 28px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.6;
            margin: 0 0 20px;
            /* スマホ幅で「い」だけが次行に落ちないよう、文節で折り返す */
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;   /* 16px 未満だと iOS が自動ズームする */
            border: 1px solid #cfd8d7;
            border-radius: 10px;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: var(--main-color);
        }

        button {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            font-size: 15px;
            color: #fff;
            background: var(--main-color);
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover { background: #2db6ac; }

        .error {
            margin: 0 0 14px;
            padding: 10px 12px;
            font-size: 13px;
            color: #a8261c;
            background: #fdecea;
            border-radius: 8px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>パスワードを入力してください</h1>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next }}">
            <input type="password" name="password" placeholder="パスワード"
                   autocomplete="current-password" autofocus required>
            <button type="submit">入る</button>
        </form>
    </div>
</body>

</html>
